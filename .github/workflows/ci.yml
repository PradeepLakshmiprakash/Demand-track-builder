name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dt
          POSTGRES_PASSWORD: dt
          POSTGRES_DB: demand_tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg://dt:dt@localhost:5432/demand_tracker_test
      TEST_DATABASE_URL: postgresql+psycopg://dt:dt@localhost:5432/demand_tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy app seed tests
      - name: Migrations apply from scratch and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests
        run: pytest
