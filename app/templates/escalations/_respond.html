{# Needs: e (escalation), sd (its demand or none), actions, reasons, is_owner; next_url (optional). #}
<form method="post" action="/escalations/{{ e.id }}/resolve" class="stack esc-form">
  {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
  <fieldset class="f radios"><legend>What will you do?</legend>
    {% for a in actions %}
      <label><input type="radio" name="action" value="{{ a.value }}" {{ 'checked' if loop.first }} required> {{ "I'll correct it and resubmit" if a.value == 'return' and is_owner else "Not ours: ignore this requisition" if not sd else a.label }}</label>
    {% endfor %}
  </fieldset>
  <label class="f extend-date"><span class="extend-label">New due date</span><input type="date" name="extend_to"></label>
  <label class="f">Why?
    <select name="reason" required>
      <option value="">Choose a reason</option>
      {% for r in reasons %}<option>{{ r }}</option>{% endfor %}
    </select>
  </label>
  <label class="f">Comment<textarea name="comment" rows="3" placeholder="What was agreed, and with whom (required with Other)"></textarea></label>
  <div><button class="btn primary">Respond</button></div>
</form>
<script>
(function () {
  if (window.__escForms) return;
  window.__escForms = true;
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.esc-form').forEach(function (f) {
      var box = f.querySelector('.extend-date');
      function sync() {
        var ext = f.querySelector('input[name=action][value=extend]');
        var start = f.querySelector('input[name=action][value=new_start]');
        var isStart = !!(start && start.checked);
        box.hidden = !((ext && ext.checked) || isStart);
        f.querySelector('.extend-label').textContent = isStart ? 'Revised start date' : 'New due date';
      }
      f.querySelectorAll('input[name=action]').forEach(function (r) { r.addEventListener('change', sync); });
      sync();
    });
  });
})();
</script>
